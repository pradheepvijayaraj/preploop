name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows-x64
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require updater signing configuration
        if: github.repository == 'utilinlabs/preploop' && startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$SIGNING_CONFIGURED" != true ]; then
            echo "Configure TAURI_SIGNING_PRIVATE_KEY before building installers"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Validate version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          if [ "$GITHUB_REPOSITORY" = "utilinlabs/preploop" ] && [ -n "$RELEASE_TAG" ]; then
            LATEST_RELEASE_TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // empty')
            if [ -n "$LATEST_RELEASE_TAG" ]; then
              export LATEST_RELEASE_TAG
            else
              echo "No previous release found; validating this as the first release."
            fi
          fi
          bun run version:check

      - name: Restore model cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: src-tauri/models/granite-r2-q8_0.gguf
          key: granite-r2-${{ hashFiles('scripts/fetch-model.ts') }}

      - name: Verify embedding model
        run: bun run model:fetch

      - name: Build frontend
        run: bun run build

      - name: Upload frontend
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installer-frontend
          path: build/
          if-no-files-found: error
          retention-days: 1

      - name: Upload embedding model
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: installer-embedding-model
          path: src-tauri/models/granite-r2-q8_0.gguf
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || (inputs.target == 'windows-x64' && matrix.platform == 'Windows' && matrix.arch == 'x64')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tauri needs the app target to create macOS updater archives. The
          # public installer matrix still contains DMGs only.
          - platform: macOS
            arch: x64
            runner: macos-15-intel
            bundles: dmg
            release_bundles: app,dmg
          - platform: macOS
            arch: arm64
            runner: macos-15
            bundles: dmg
            release_bundles: app,dmg
          - platform: Windows
            arch: x64
            runner: windows-2022
            bundles: nsis
            release_bundles: nsis
          - platform: Windows
            arch: arm64
            runner: windows-11-arm
            bundles: nsis
            release_bundles: nsis
          - platform: Linux
            arch: x64
            runner: ubuntu-22.04
            bundles: appimage
            release_bundles: appimage
          - platform: Linux
            arch: arm64
            runner: ubuntu-22.04-arm
            bundles: appimage
            release_bundles: appimage

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@858a1ecb106d4516018578006590eb829de1f08e # 1.96.1

      - name: Install system dependencies
        if: matrix.platform == 'Linux'
        uses: ./.github/actions/setup-linux-deps

      - name: Configure Clang for Windows ARM64
        if: matrix.platform == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          # llama.cpp rejects MSVC's ARM compiler. Ninja lets cc-rs and CMake
          # both use clang-cl while retaining the native Windows SDK libraries.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -property installationPath
          if (-not $vsPath) { throw "Visual Studio installation not found" }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          $devEnv = & cmd /c "`"$devCmd`" -arch=arm64 -host_arch=arm64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "Failed to initialize the ARM64 SDK environment" }
          foreach ($line in $devEnv) {
            if ($line -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process')
              $line | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          $clang = (Get-Command clang-cl.exe -ErrorAction Stop).Source
          Get-Command ninja.exe -ErrorAction Stop | Out-Null
          "CC=$clang", "CXX=$clang", "CMAKE_GENERATOR=Ninja" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # cc-rs compiles llama.cpp's try/catch wrapper outside CMake.
          "CXXFLAGS_aarch64_pc_windows_msvc=/EHsc" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          cache-workspace-crates: true
          # Keep compiler configuration in the key, not unrelated workflow text.
          key: native-v3-${{ hashFiles('src-tauri/tauri.conf.json') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET

      - name: Restore Tauri tool cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: src-tauri/target/.tauri
          key: tauri-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Download frontend
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installer-frontend
          path: build

      - name: Download embedding model
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: installer-embedding-model
          path: src-tauri/models

      - name: Build unsigned installer
        if: github.repository != 'utilinlabs/preploop' || !startsWith(github.ref, 'refs/tags/v')
        run: bun node_modules/@tauri-apps/cli/tauri.js build --ci --config src-tauri/tauri.prebuilt.conf.json --bundles ${{ matrix.bundles }}

      - name: Build signed installer
        if: github.repository == 'utilinlabs/preploop' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Shared artifacts are built from this run's exact commit; no quality gate.
        run: bun node_modules/@tauri-apps/cli/tauri.js build --ci --config src-tauri/tauri.prebuilt.conf.json --config src-tauri/tauri.updater.conf.json --bundles ${{ matrix.release_bundles }}

      - name: Upload macOS artifacts
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrepLoop-macOS-${{ matrix.arch }}
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload Windows artifacts
        if: matrix.platform == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrepLoop-Windows-${{ matrix.arch }}
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PrepLoop-Linux-${{ matrix.arch }}-AppImage
          compression-level: 0
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    if: github.repository == 'utilinlabs/preploop' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: PrepLoop-*
          path: installer-artifacts

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: bun scripts/prepare-release-assets.ts installer-artifacts release-assets

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/draft-release.sh release-assets
