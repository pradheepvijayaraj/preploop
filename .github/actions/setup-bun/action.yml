name: Set up Bun
description: Install the pinned Bun runtime and project dependencies with caching
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.0
    - name: Restore package cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/bun-install-cache
        key: bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.0-
    - name: Install dependencies
      shell: bash
      env:
        BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      run: bun install --frozen-lockfile
