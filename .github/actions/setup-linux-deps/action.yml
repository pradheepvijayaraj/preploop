name: Install Linux dependencies
description: Install required system packages using a cached APT archive
runs:
  using: composite
  steps:
    - name: Read distribution version
      id: distro
      shell: bash
      run: |
        . /etc/os-release
        echo "key=${ID}-${VERSION_ID}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - name: Restore package cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ runner.temp }}/preploop-apt/*.deb
        key: apt-${{ steps.distro.outputs.key }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-linux-deps/action.yml') }}
    - name: Install dependencies
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/preploop-apt/partial"
        sudo apt-get update
        sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/preploop-apt" install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
